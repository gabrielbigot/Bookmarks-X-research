<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recherche dans mes bookmarks</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="col">
      <div class="row">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.18 5.27l4.78 4.78-1.42 1.42-4.78-4.78A8.5 8.5 0 0 1 1.75 10.25z"/></svg>
          <input id="q" type="search" placeholder="Décris ce que tu cherches… (from:@user  has:link  since:2026-01-01)" autocomplete="off" autofocus>
        </div>
        <button id="close" title="Fermer (Échap)" hidden>✕</button>
      </div>
      <div class="bar">
        <span id="stats">Chargement…</span>
        <span class="spacer"></span>
        <button id="sync" class="ghost">⟳ Tout synchroniser</button>
        <button id="stop" class="ghost" hidden>■ Stop</button>
      </div>
      <div class="bar sub"><span id="progress"></span></div>
      <div class="bar sub"><span id="index"></span><button id="retry" class="ghost" hidden>Réessayer</button></div>
      <div id="mode" class="mode"></div>
    </div>
  </header>
  <main id="results" class="col"></main>
  <script type="module" src="panel.js"></script>
</body>
</html>
